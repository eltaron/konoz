<!doctype html>
<html dir="rtl" lang="ar">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>الاختبار الإلكتروني | منصة كنوز القرآن</title>
    <meta name="description" content="الاختبار الإلكتروني لتقييم مستواك." />
    <link rel="icon" type="image/png" sizes="32x32" href="../images/favicon/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="../images/favicon/favicon-16x16.png" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet" />
    <link href="../css/style.css" rel="stylesheet" />
    <style>
      body { font-family: 'Tajawal', sans-serif; background: #f7fafb; overflow-x: hidden; }
      .exam-container { max-width: 900px; margin: 0 auto; padding: 100px 16px 40px; }
      .q-nav-btn { width: 40px; height: 40px; border-radius: 10px; border: 1.5px solid rgba(15,109,128,0.08); background: transparent; font-size: 0.8rem; font-weight: 500; transition: all 0.2s; }
      .q-nav-btn.answered { background: #0F6D80; color: #fff; border-color: #0F6D80; }
      .q-nav-btn.current { border-color: #0F6D80; box-shadow: 0 0 0 3px rgba(15,109,128,0.1); font-weight: 700; }
      .q-nav-btn:hover { border-color: #0F6D80; }
      .option-item { padding: 12px 16px; border-radius: 12px; border: 1.5px solid rgba(15,109,128,0.06); cursor: pointer; transition: all 0.2s; background: #fff; }
      .option-item:hover { border-color: rgba(15,109,128,0.2); background: rgba(15,109,128,0.02); }
      .option-item.selected { border-color: #0F6D80; background: rgba(15,109,128,0.04); }
      .option-item input[type="radio"] { display: none; }
      .option-item .radio-circle { width: 20px; height: 20px; min-width: 20px; border-radius: 50%; border: 2px solid rgba(15,109,128,0.15); display: inline-flex; align-items: center; justify-content: center; transition: all 0.2s; }
      .option-item.selected .radio-circle { border-color: #0F6D80; background: #0F6D80; color: #fff; }
      .exam-timer { background: rgba(231,76,60,0.06); color: #e74c3c; padding: 8px 16px; border-radius: 10px; font-weight: 700; }
    </style>
  </head>
  <body>
    <div class="exam-container">
      <!-- Top bar -->
      <div class="d-flex align-items-center justify-content-between mb-4">
        <a href="exams.html" class="btn rounded-3 px-3 py-2" style="border: 1.5px solid rgba(15,109,128,0.08);"><i class="fa-solid fa-arrow-right mr-1"></i>العودة</a>
        <div class="d-flex align-items-center gap-3">
          <span class="small text-secondary opacity-75">اختبار مراجعة سورة مريم</span>
          <span class="exam-timer small"><i class="fa-regular fa-clock mr-1"></i><span id="timerDisplay">٤٥:٠٠</span></span>
        </div>
      </div>

      <!-- Progress -->
      <div class="d-flex align-items-center gap-2 mb-3">
        <div class="flex-grow-1" style="height: 6px; background: #e0e3e4; border-radius: 10px; overflow: hidden;">
          <div id="progressBar" class="h-100" style="width: 0%; background: #0F6D80; border-radius: 10px; transition: width 0.5s;"></div>
        </div>
        <span class="small fw-bold" style="color: #0F6D80;"><span id="qCounter">١</span>/<span id="qTotal">٣٠</span></span>
      </div>

      <!-- Question nav -->
      <div class="d-flex flex-wrap gap-2 mb-4" id="qNav"></div>

      <!-- Question card -->
      <div class="card border-0 shadow-sm rounded-4 p-4 mb-3">
        <p class="small text-secondary opacity-50 mb-2">السؤال <span id="qNumDisplay">١</span></p>
        <h5 class="fw-bold mb-4" id="qText" style="color: #0F6D80;"></h5>
        <div class="d-flex flex-column gap-2" id="qOptions"></div>
      </div>

      <!-- Controls -->
      <div class="d-flex align-items-center justify-content-between gap-3">
        <button class="btn rounded-3 px-4 py-2" id="prevBtn" style="border: 1.5px solid rgba(15,109,128,0.08);" onclick="prevQ()"><i class="fa-solid fa-chevron-right mr-1"></i>السابق</button>
        <button class="btn rounded-3 px-4 py-2" id="nextBtn" style="background: #0F6D80; color: #fff;" onclick="nextQ()">التالي<i class="fa-solid fa-chevron-left ml-1"></i></button>
        <button class="btn rounded-3 px-4 py-2 d-none" id="submitBtn" style="background: #27ae60; color: #fff;" onclick="submitExam()"><i class="fa-solid fa-check ml-1"></i>إنهاء الاختبار</button>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="../js/main.js"></script>
    <script>
      const questions = [
        { q: 'ما هي السورة التي تُسمى "قلب القرآن"؟', opts: ['سورة يس', 'سورة الرحمن', 'سورة الواقعة', 'سورة الملك'], ans: 0 },
        { q: 'كم عدد آيات سورة الفاتحة؟', opts: ['٥', '٦', '٧', '٨'], ans: 2 },
        { q: 'أي سورة افتُتحت بـ"الم"؟', opts: ['سورة البقرة', 'سورة آل عمران', 'سورة العنكبوت', 'جميع ما سبق'], ans: 3 },
        { q: 'السورة التي ورد فيها ذكر البسملة مرتين هي:', opts: ['سورة النمل', 'سورة هود', 'سورة إبراهيم', 'سورة الإسراء'], ans: 0 },
        { q: 'ما هي أطول سورة في القرآن الكريم؟', opts: ['سورة البقرة', 'سورة آل عمران', 'سورة النساء', 'سورة الأنعام'], ans: 0 },
        { q: 'كم عدد السجدات في القرآن الكريم؟', opts: ['١٢', '١٤', '١٥', '١٦'], ans: 2 },
        { q: 'سورة الفيل من السور:', opts: ['المكية', 'المدنية', 'الاختلافية', 'لا شيء'], ans: 0 },
        { q: 'ما معنى "الكرسي" في آية الكرسي؟', opts: ['العرش', 'الملك', 'العلم', 'القاعدة'], ans: 2 },
        { q: 'السورة التي تسمى "عروس القرآن" هي:', opts: ['سورة الرحمن', 'سورة يس', 'سورة طه', 'سورة مريم'], ans: 0 },
        { q: 'كم جزءاً في القرآن الكريم؟', opts: ['٢٠', '٢٥', '٣٠', '٣٥'], ans: 2 },
        { q: 'أي سورة تبدأ بـ"تبارك"؟', opts: ['سورة تبارك (الملك)', 'سورة الأعلى', 'سورة البروج', 'سورة الطارق'], ans: 0 },
        { q: 'ما هي السورة التي لا تبدأ بالبسملة؟', opts: ['سورة التوبة', 'سورة النحل', 'سورة النمل', 'سورة الإسراء'], ans: 0 },
        { q: 'كم عدد أحرف القرآن الكريم؟', opts: ['٣٢٣٦٧٠', '٣٢٣٦٧١', '٣٠٠٠٠٠', '٣٥٠٠٠٠'], ans: 0 },
        { q: 'أي آية هي أعظم آية في القرآن؟', opts: ['آية الكرسي', 'آخر آية من البقرة', 'أول آية من الفاتحة', 'آية النور'], ans: 0 },
        { q: 'سورة الإخلاص تعدل:', opts: ['ثلث القرآن', 'ربع القرآن', 'نصف القرآن', 'القرآن كاملاً'], ans: 0 },
        { q: 'ما هو الحرف المقطع الذي بدأت به سورة "ص"؟', opts: ['ص', 'ق', 'ن', 'حم'], ans: 0 },
        { q: 'السورة التي ورد فيها ذكر "الروح" هي:', opts: ['سورة القدر', 'سورة الإسراء', 'سورة النبأ', 'جميع ما سبق'], ans: 3 },
        { q: 'كم عدد أسماء سورة الفاتحة؟', opts: ['أكثر من ١٠', '٧', '٥', '٣'], ans: 0 },
        { q: 'السورة التي تبدأ بـ"الر" هي:', opts: ['سورة يونس', 'سورة يوسف', 'سورة إبراهيم', 'جميع ما سبق'], ans: 3 },
        { q: 'ما هي أقصر سورة في القرآن؟', opts: ['سورة الكوثر', 'سورة الإخلاص', 'سورة العصر', 'سورة النصر'], ans: 0 },
        { q: 'في أي سورة وردت قصة أصحاب الكهف؟', opts: ['سورة الكهف', 'سورة الإسراء', 'سورة الأنبياء', 'سورة المؤمنون'], ans: 0 },
        { q: 'كم عدد آيات سورة يس؟', opts: ['٨٠', '٨٣', '٨٥', '٩٠'], ans: 1 },
        { q: 'السورة المسماة "سنان القرآن" هي:', opts: ['سورة البقرة', 'سورة آل عمران', 'سورة النساء', 'سورة الأنعام'], ans: 0 },
        { q: 'أي سورة تبدأ بـ"الحمد لله"؟', opts: ['الفاتحة', 'الأنعام', 'الكهف', 'فاطر'], ans: 1 },
        { q: 'كم عدد الحروف المقطعة في القرآن؟', opts: ['١٣', '١٤', '١٥', '١٢'], ans: 1 },
        { q: 'السورة التي تُسمى "المنجية" هي:', opts: ['سورة الملك', 'سورة الواقعة', 'سورة الرحمن', 'سورة يس'], ans: 1 },
        { q: 'أي سورة نزلت كاملة مرة واحدة؟', opts: ['سورة المدثر', 'سورة المزمل', 'سورة الفاتحة', 'سورة الإخلاص'], ans: 2 },
        { q: 'سورة الحجرات تسمى سورة:', opts: ['الأخلاق', 'الآداب', 'الفضائل', 'الوصايا'], ans: 0 },
        { q: 'كم عدد آيات سورة البقرة؟', opts: ['٢٨٦', '٢٨٥', '٢٨٧', '٢٨٨'], ans: 0 },
        { q: 'السورة التي ورد فيها ذكر الغار هي:', opts: ['سورة التوبة', 'سورة البراءة', 'سورة الأنفال', 'سورة الحشر'], ans: 0 },
      ];

      let answers = new Array(questions.length).fill(null);
      let currentQ = 0;
      let totalSeconds = 45 * 60;
      let timerInterval = null;

      function renderNav() {
        const nav = document.getElementById('qNav');
        nav.innerHTML = questions.map((_, i) => `
          <button class="q-nav-btn ${answers[i] !== null ? 'answered' : ''} ${i === currentQ ? 'current' : ''}" onclick="goQ(${i})">${i + 1}</button>
        `).join('');
      }

      function renderQ() {
        const q = questions[currentQ];
        document.getElementById('qNumDisplay').textContent = currentQ + 1;
        document.getElementById('qText').textContent = q.q;
        document.getElementById('qCounter').textContent = currentQ + 1;
        document.getElementById('qTotal').textContent = questions.length;

        const opts = document.getElementById('qOptions');
        opts.innerHTML = q.opts.map((o, i) => `
          <label class="option-item d-flex align-items-center gap-3 ${answers[currentQ] === i ? 'selected' : ''}">
            <input type="radio" name="q" value="${i}" ${answers[currentQ] === i ? 'checked' : ''} onchange="selectAns(${i})" />
            <span class="radio-circle">${answers[currentQ] === i ? '<i class="fa-solid fa-check" style="font-size: 0.6rem;"></i>' : ''}</span>
            <span>${o}</span>
          </label>
        `).join('');

        const progress = ((currentQ + 1) / questions.length) * 100;
        document.getElementById('progressBar').style.width = progress + '%';

        document.getElementById('prevBtn').style.visibility = currentQ === 0 ? 'hidden' : 'visible';
        const isLast = currentQ === questions.length - 1;
        document.getElementById('nextBtn').classList.toggle('d-none', isLast);
        document.getElementById('submitBtn').classList.toggle('d-none', !isLast);

        renderNav();
      }

      function selectAns(i) {
        answers[currentQ] = i;
        document.querySelectorAll('.option-item').forEach((el, idx) => {
          el.classList.toggle('selected', idx === i);
          const circle = el.querySelector('.radio-circle');
          circle.innerHTML = idx === i ? '<i class="fa-solid fa-check" style="font-size: 0.6rem;"></i>' : '';
        });
        renderNav();
      }

      function nextQ() { if (currentQ < questions.length - 1) { currentQ++; renderQ(); } }
      function prevQ() { if (currentQ > 0) { currentQ--; renderQ(); } }
      function goQ(i) { currentQ = i; renderQ(); }

      function startTimer() {
        timerInterval = setInterval(() => {
          totalSeconds--;
          const m = String(Math.floor(totalSeconds / 60)).padStart(2, '0');
          const s = String(totalSeconds % 60).padStart(2, '0');
          document.getElementById('timerDisplay').textContent = `${m}:${s}`;
          if (totalSeconds <= 300) document.querySelector('.exam-timer').style.background = 'rgba(231,76,60,0.12)';
          if (totalSeconds <= 0) { clearInterval(timerInterval); submitExam(); }
        }, 1000);
      }

      function submitExam() {
        clearInterval(timerInterval);
        const answered = answers.filter(a => a !== null).length;
        const unanswered = questions.length - answered;
        if (unanswered > 0) {
          Swal.fire({ icon: 'warning', title: 'أسئلة بدون إجابة', text: `لديك ${unanswered} سؤال لم تجيبي عليها بعد`, showCancelButton: true, confirmButtonColor: '#0F6D80', confirmButtonText: 'إرسال', cancelButtonText: 'مراجعة' }).then(r => { if (r.isConfirmed) calcResult(); });
        } else { calcResult(); }
      }

      function calcResult() {
        const correct = questions.filter((q, i) => answers[i] === q.ans).length;
        const total = questions.length;
        const pct = Math.round((correct / total) * 100);
        let grade = pct >= 90 ? 'ممتاز' : pct >= 75 ? 'جيد جداً' : pct >= 60 ? 'جيد' : pct >= 50 ? 'مقبول' : 'ضعيف';
        let icon = pct >= 75 ? 'success' : pct >= 50 ? 'warning' : 'error';
        let emoji = pct >= 90 ? '🎉' : pct >= 75 ? '👍' : pct >= 60 ? '💪' : '📚';
        Swal.fire({
          icon, title: `${emoji} النتيجة: ${grade}`,
          html: `<div style="text-align: center;">
            <div style="font-size: 3rem; font-weight: 800; color: ${pct >= 75 ? '#0F6D80' : pct >= 50 ? '#e67e22' : '#e74c3c'};">${pct}%</div>
            <p>${correct} / ${total} إجابات صحيحة</p>
            <div style="height: 8px; background: #e0e3e4; border-radius: 10px; overflow: hidden; margin: 8px 0;">
              <div style="width: ${pct}%; height: 100%; background: ${pct >= 75 ? '#0F6D80' : pct >= 50 ? '#e67e22' : '#e74c3c'}; border-radius: 10px;"></div>
            </div>
          </div>`,
          confirmButtonColor: '#0F6D80', confirmButtonText: 'عرض التفاصيل'
        }).then(() => {
          let html = '<div class="text-end" style="max-height: 400px; overflow-y: auto;">';
          questions.forEach((q, i) => {
            const isCorrect = answers[i] === q.ans;
            html += `<div style="padding: 8px; border-radius: 8px; background: ${isCorrect ? 'rgba(39,174,96,0.04)' : 'rgba(231,76,60,0.04)'}; margin-bottom: 6px; border-right: 3px solid ${isCorrect ? '#27ae60' : '#e74c3c'};">`;
            html += `<small><strong>س${i+1}:</strong> ${q.q}</small><br />`;
            html += `<small>${isCorrect ? '✓ إجابة صحيحة' : '✗ ' + q.opts[q.ans]}</small>`;
            html += `</div>`;
          });
          html += '</div>';
          Swal.fire({ title: 'تفاصيل الإجابات', html, confirmButtonColor: '#0F6D80', confirmButtonText: 'حسناً' });
        });
      }

      renderQ();
      renderNav();
      startTimer();
    </script>
  </body>
</html>
